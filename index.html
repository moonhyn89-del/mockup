<script>
(function(){
 const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); let pages=[],current=0;
 const designPanel=$('#dmColor').closest('details');
 const panelDetails=[...document.querySelectorAll('.dm-panel details')].filter(d=>d!==designPanel);
 const editorPage=d=>d.querySelector('#dmP2Title')?1:d.querySelector('#dmP3Title')?2:d.querySelector('#dmP4Title')?3:d.querySelector('#dmP5Title')?4:0;
 function showEditor(i){panelDetails.forEach(d=>{const visible=editorPage(d)===i;d.style.display=visible?'block':'none';if(visible)d.open=true});const title=$('.dm-panel h2');if(title)title.textContent=i===0?'메인 화면 입력':`${pages[i]?.name||`상세 메뉴 ${i}`} 입력`;const help=$('.dm-panel .dm-help');if(help)help.textContent=i===0?'메인 화면에 들어갈 내용을 입력하세요.':'현재 선택한 상세 화면의 모든 입력 항목입니다.'}
 const rows=(id,sep='|')=>$(id).value.split('\n').map(x=>x.split(sep).map(v=>v.trim())).filter(x=>x[0]);
 const detailData=n=>({title:$(`#dmP${n}Title`).value.trim(),eyebrow:$(`#dmP${n}Eyebrow`).value.trim(),lead:$(`#dmP${n}Lead`).value.trim(),blocks:rows(`#dmP${n}Blocks`),table:rows(`#dmP${n}Table`),button:$(`#dmP${n}Button`).value.trim()});
 function data(){return{name:$('#dmName').value.trim()||'회사명',eng:$('#dmEnglish').value.trim()||'COMPANY',business:$('#dmBusiness').value.trim()||'핵심 서비스',focus:$('#dmFocus').value.trim(),heroDesc:$('#dmHeroDesc').value.trim(),heroImage:$('#dmHeroImage').value.trim(),button1:$('#dmButton1').value.trim(),button2:$('#dmButton2').value.trim(),introTitle:$('#dmIntroTitle').value.trim(),intro:$('#dmIntro').value.trim(),introImage:$('#dmIntroImage').value.trim(),phone:$('#dmPhone').value.trim(),email:$('#dmEmail').value.trim(),address:$('#dmAddress').value.trim(),services:rows('#dmServices'),stats:rows('#dmStats'),process:$('#dmProcess').value.split(',').map(x=>x.trim()).filter(Boolean),cases:rows('#dmCases'),faq:rows('#dmFaq'),cta:$('#dmCtaTitle').value.trim(),footer:$('#dmFooter').value.trim(),extra:$('#dmExtraRequest').value.trim(),details:[2,3,4,5].map(detailData),menus:$('#dmMenus').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,5),count:5,navy:$('#dmColor').value,accent:$('#dmAccent').value}}
 function head(d){const request=d.extra?`<section class="request-preview"><strong>추가 요청사항</strong>${esc(d.extra)}</section>`:'';return `${request}<div class="topbar"><span>${esc(d.phone)}</span><span>${esc(d.email)}</span></div><header class="site-head"><b class="site-logo">${esc(d.eng)}</b><nav class="site-nav">${d.menus.map(x=>`<span>${esc(x)}</span>`).join('')}</nav></header>`}
 function foot(d){return `<section class="cta"><h2>${esc(d.cta)}</h2><p>${esc(d.heroDesc)}</p><span class="site-btn">${esc(d.button1)}</span></section><footer class="footer"><strong>${esc(d.name)}</strong>${esc(d.address)}<br>${esc(d.phone)} · ${esc(d.email)}<br>${esc(d.footer)}</footer>`}
 function home(d){return `${head(d)}<section class="hero hero-photo" style="background:linear-gradient(100deg,rgba(5,18,38,.92),rgba(10,35,68,.43)),url('${esc(d.heroImage)}')"><div class="hero-in"><div class="eyebrow">${esc(d.eng)}</div><h1>${esc(d.focus)}</h1><p>${esc(d.heroDesc)}</p><div class="hero-btns"><span class="site-btn">${esc(d.button1)}</span><span class="site-btn ghost">${esc(d.button2)}</span></div></div></section><section class="home-section intro-grid"><div class="intro-art" style="background:linear-gradient(rgba(7,24,47,.08),rgba(7,24,47,.08)),url('${esc(d.introImage)}')"></div><div class="intro-copy"><span class="kicker">ABOUT COMPANY</span><h2>${esc(d.introTitle)}</h2><p>${esc(d.intro)}</p><span class="site-btn">회사소개 보기</span></div></section><section class="home-section alt"><div class="home-title"><span class="kicker">OUR SERVICES</span><h2>${esc(d.name)}의 전문 서비스</h2><p>${esc(d.business)} 분야에 필요한 진단부터 실행까지 체계적으로 지원합니다.</p></div><div class="service-grid">${d.services.slice(0,6).map((x,i)=>`<article class="service-item"><em>0${i+1}</em><b>${esc(x[0])}</b><p>${esc(x[1]||'기업별 맞춤 서비스를 제공합니다.')}</p></article>`).join('')}</div></section><section class="stat-row">${d.stats.slice(0,4).map(x=>`<div class="stat"><strong>${esc(x[0])}</strong><span>${esc(x[1]||'성과 지표')}</span></div>`).join('')}</section><section class="home-section"><div class="home-title"><span class="kicker">PROCESS</span><h2>체계적인 진행 절차</h2></div><div class="process">${d.process.slice(0,4).map((x,i)=>`<div class="step"><small>STEP 0${i+1}</small><b>${esc(x)}</b><p>담당 전문가가 필요한 내용을 확인하고 단계별로 안내합니다.</p></div>`).join('')}</div></section><section class="home-section alt"><div class="home-title"><span class="kicker">SUCCESS CASE</span><h2>주요 컨설팅 사례</h2></div><div class="case-grid">${d.cases.slice(0,3).map(x=>`<article class="case"><div class="case-top"><small>${esc(x[0])}</small><strong>${esc(x[1]||'성공 사례')}</strong></div><div class="case-body">${esc(x[2]||'맞춤 컨설팅을 통해 목표를 달성했습니다.')}<br><b style="color:var(--accent)">자세히 보기 →</b></div></article>`).join('')}</div></section><section class="home-section"><div class="home-title"><span class="kicker">FAQ</span><h2>자주 묻는 질문</h2></div><div class="home-faq">${d.faq.slice(0,5).map(x=>`<div>Q. ${esc(x[0])}<span style="float:right">＋</span><small style="display:block;margin-top:7px;color:#8993a0;font-weight:400">${esc(x[1]||'상담 시 자세히 안내드립니다.')}</small></div>`).join('')}</div></section>${foot(d)}`}
 function inner(d,index,menu){const p=d.details[index-1]||{title:menu,eyebrow:d.eng,lead:'',blocks:[],table:[],button:d.button1};const pageTitle=p.title||menu;return `${head(d)}<section class="page-hero"><small>${esc(p.eyebrow)}</small><h1>${esc(pageTitle)}</h1><p>${esc(p.lead)}</p></section><section class="detail-wrap"><aside class="detail-side"><b>${esc(pageTitle)}</b>${d.menus.slice(1).map(x=>`<span>${esc(x)}</span>`).join('')}</aside><main class="detail-main"><h2>${esc(pageTitle)}</h2><p class="detail-lead">${esc(p.lead)}</p>${p.blocks.map(x=>`<article class="detail-block"><h3>${esc(x[0])}</h3><p>${esc(x[1]||'')}</p></article>`).join('')}<table class="detail-table"><tbody>${p.table.map(x=>`<tr><th>${esc(x[0])}</th><td>${esc(x[1]||'')}</td></tr>`).join('')}</tbody></table><div class="detail-action"><span class="site-btn">${esc(p.button)}</span></div></main></section>${foot(d)}`}
 function build(){const d=data();document.querySelector('#dm-auto-mockup').style.setProperty('--navy',d.navy);document.querySelector('#dm-auto-mockup').style.setProperty('--accent',d.accent);let menus=d.menus.length?d.menus:['홈','회사소개','정책자금','성공사례','상담신청'];while(menus.length<5)menus.push(`메뉴 ${menus.length+1}`);pages=menus.slice(0,d.count).map((m,i)=>({name:i===0?m:(d.details[i-1]?.title||m),html:i===0?home(d):inner(d,i,m)}));current=0;renderTabs();show(0);$('#dmStatus').textContent=`${pages.length}개 화면이 생성되었습니다.`}
 function renderTabs(){$('#dmTabs').innerHTML=pages.map((p,i)=>`<button class="dm-tab ${i===current?'on':''}" data-i="${i}">${i+1}. ${esc(p.name)}</button>`).join('');document.querySelectorAll('.dm-tab').forEach(b=>b.onclick=()=>show(+b.dataset.i))}
 function show(i){current=i;$('#dmCanvas').innerHTML=pages[i]?.html||'<div class="dm-empty">생성된 화면이 없습니다.</div>';renderTabs();showEditor(i)}
 async function download(){if(!pages.length)return alert('먼저 시안을 생성해주세요.');if(typeof html2canvas==='undefined')return alert('이미지 저장 모듈을 불러오지 못했습니다.');const status=$('#dmStatus'),target=$('#dmCanvas');status.textContent='이미지를 만드는 중입니다…';try{let canvas;try{canvas=await html2canvas(target,{scale:1.5,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false,imageTimeout:12000})}catch(firstError){canvas=await html2canvas(target,{scale:1,useCORS:false,allowTaint:false,backgroundColor:'#ffffff',logging:false,onclone:doc=>{doc.querySelectorAll('.hero-photo,.intro-art').forEach(el=>{el.style.backgroundImage='none';el.style.backgroundColor='#16345c'})}})}canvas.toBlob(blob=>{if(!blob){status.textContent='이미지 변환에 실패했습니다.';return alert('이미지 변환에 실패했습니다.')}const url=URL.createObjectURL(blob),a=document.createElement('a');a.download=`${data().name}-${pages[current].name}-시안.png`;a.href=url;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);status.textContent='현재 화면을 PNG로 저장했습니다.'},'image/png')}catch(error){console.error(error);status.textContent='저장 실패 — 다시 시도해 주세요.';alert('이미지 저장에 실패했습니다. 외부 이미지가 차단된 경우 기본 배경으로 다시 저장됩니다.')}}
 if(designPanel){designPanel.open=true;designPanel.classList.add('dm-designbar');const topGroup=designPanel.querySelector('.dm-group');const actions=document.querySelector('.dm-actions');if(topGroup&&actions)topGroup.append(actions);document.querySelector('#dm-auto-mockup').prepend(designPanel)}
 $('#dmGenerate').onclick=build;$('#dmDownload').onclick=download;build();
})();
</script>
</body>
</html>
