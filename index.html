<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈페이지 자동 시안 생성기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
#dm-auto-mockup,#dm-auto-mockup *{box-sizing:border-box}
#dm-auto-mockup{--accent:#b88a3b;--navy:#112b4d;font-family:Pretendard,sans-serif;color:#172033;background:#eef2f7;padding:24px;min-height:100vh}
#dm-auto-mockup button,#dm-auto-mockup input,#dm-auto-mockup textarea,#dm-auto-mockup select{font:inherit}
.dm-shell{max-width:1500px;margin:auto;display:grid;grid-template-columns:370px minmax(0,1fr);gap:22px}
.dm-panel,.dm-stage{background:#fff;border:1px solid #dde3eb;border-radius:20px;box-shadow:0 12px 36px rgba(20,40,70,.08)}
.dm-panel{padding:20px;align-self:start;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow-y:auto}
.dm-panel h2{margin:0 0 4px;font-size:20px}
.dm-help{margin:0 0 14px;color:#748092;font-size:12px;line-height:1.5}
.dm-field{margin-top:12px}
.dm-field label{display:block;margin-bottom:5px;font-size:12px;font-weight:700;color:#2a3a52}
.dm-field input,.dm-field textarea,.dm-field select{width:100%;border:1px solid #d7dde6;border-radius:9px;padding:9px 11px;color:#202b3c;background:#fff;outline:none;font-size:12px}
.dm-field textarea{resize:vertical}
.dm-field input:focus,.dm-field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(180,122,50,0.14)}
.dm-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.dm-btn{border:0;border-radius:11px;padding:11px 10px;font-weight:800;cursor:pointer;font-size:13px}
.dm-generate{background:var(--navy);color:#fff}
.dm-download{background:#e9eef5;color:#1d304a}
.dm-stage{padding:18px;min-width:0}
.dm-stage-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.dm-stage-head strong{font-size:15px}
.dm-device{padding:10px;background:#202733;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.15)}
.dm-browser{height:34px;background:#edf1f5;border-radius:9px 9px 0 0;display:flex;align-items:center;gap:6px;padding:0 12px}
.dm-dot{width:8px;height:8px;border-radius:50%;background:#b7c0cb}
.dm-url{margin-left:8px;background:#fff;border:1px solid #d8dfe8;border-radius:6px;width:42%;height:20px}
.dm-canvas{background:#fff;min-height:670px;overflow:hidden}
.dm-status{font-size:12px;color:#6f7a89}
/* panel accordion */
#dm-auto-mockup .dm-panel details{margin-top:6px;border:1px solid #e0e5ec;border-radius:10px;background:#fafbfd}
#dm-auto-mockup .dm-panel summary{padding:10px 12px;cursor:pointer;font-size:12px;font-weight:900;color:#24364e;list-style:none}
#dm-auto-mockup .dm-panel summary:after{content:'＋';float:right;color:#8490a0}
#dm-auto-mockup .dm-panel details[open] summary:after{content:'－'}
#dm-auto-mockup .dm-group{padding:0 10px 12px}
#dm-auto-mockup .dm-note{font-size:11px;color:#8791a0;line-height:1.5;margin:6px 0 0}
/* site preview styles */
#dm-auto-mockup .topbar{height:32px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:20px;padding:0 6%;font-size:10px}
#dm-auto-mockup .site-head{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid rgba(0,0,0,.07)}
#dm-auto-mockup .site-logo{font-size:17px;font-weight:900;color:var(--navy)}
#dm-auto-mockup .site-nav{display:flex;gap:22px;font-size:12px;font-weight:700}
#dm-auto-mockup .site-nav span:last-child{color:var(--accent)}
#dm-auto-mockup .hero-photo{min-height:390px;background-size:cover!important;background-position:center!important;padding:68px 7%;display:flex;align-items:center;color:#fff}
#dm-auto-mockup .hero-in{max-width:690px}
#dm-auto-mockup .eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#ead7ae}
#dm-auto-mockup .hero-photo h1{margin:12px 0 16px;font-size:42px;line-height:1.1;letter-spacing:-2px;color:#fff}
#dm-auto-mockup .hero-photo p{margin:0;max-width:600px;color:rgba(255,255,255,.8);line-height:1.7;font-size:13px}
#dm-auto-mockup .hero-btns{display:flex;gap:10px;margin-top:24px}
#dm-auto-mockup .site-btn{padding:11px 18px;border-radius:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:inline-block}
#dm-auto-mockup .site-btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.45)}
#dm-auto-mockup .home-section{padding:48px 7%}
#dm-auto-mockup .home-section.alt{background:#f5f7fb}
#dm-auto-mockup .intro-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:38px;align-items:center}
#dm-auto-mockup .intro-art{height:250px;border-radius:16px;background-size:cover!important;background-position:center!important;box-shadow:0 14px 38px rgba(10,30,60,.15)}
#dm-auto-mockup .kicker{color:var(--accent);font-size:10px;font-weight:900;letter-spacing:1.8px}
#dm-auto-mockup .intro-copy h2,#dm-auto-mockup .home-title h2{margin:8px 0 12px;font-size:26px;color:var(--navy);letter-spacing:-1px}
#dm-auto-mockup .intro-copy p,#dm-auto-mockup .home-title p{color:#6c7786;line-height:1.75;font-size:12px}
#dm-auto-mockup .home-title{text-align:center;max-width:700px;margin:0 auto 24px}
#dm-auto-mockup .service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#dm-auto-mockup .service-item{padding:18px;border-radius:13px;border:1px solid #e0e6ee;background:#fff;min-height:130px}
#dm-auto-mockup .service-item em{display:flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:9px;background:#f5e9d4;color:var(--accent);font-style:normal;font-weight:900;font-size:13px}
#dm-auto-mockup .service-item b{display:block;color:var(--navy);font-size:14px;margin:10px 0 5px}
#dm-auto-mockup .service-item p{margin:0;color:#788392;font-size:11px;line-height:1.6}
#dm-auto-mockup .stat-row{display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy);color:#fff}
#dm-auto-mockup .stat{padding:22px 12px;text-align:center;border-right:1px solid rgba(255,255,255,.12)}
#dm-auto-mockup .stat strong{display:block;color:#e8c987;font-size:26px}
#dm-auto-mockup .stat span{font-size:11px;color:rgba(255,255,255,.7)}
#dm-auto-mockup .process{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
#dm-auto-mockup .step{border-top:3px solid var(--accent);padding:16px;background:#fff;box-shadow:0 6px 20px rgba(20,40,70,.07)}
#dm-auto-mockup .step small{color:var(--accent);font-weight:900;font-size:10px}
#dm-auto-mockup .step b{display:block;color:var(--navy);margin:8px 0 5px;font-size:14px}
#dm-auto-mockup .step p{font-size:11px;color:#7b8592;line-height:1.55;margin:0}
#dm-auto-mockup .case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#dm-auto-mockup .case{border:1px solid #e3e7ed;border-radius:13px;overflow:hidden;background:#fff}
#dm-auto-mockup .case-top{height:82px;background:linear-gradient(135deg,var(--navy),#3d5a3e);padding:16px;color:#fff}
#dm-auto-mockup .case-top small{opacity:.7;font-size:10px}
#dm-auto-mockup .case-top strong{display:block;font-size:17px;margin-top:6px}
#dm-auto-mockup .case-body{padding:14px;font-size:11px;color:#657182;line-height:1.65}
#dm-auto-mockup .home-faq{max-width:800px;margin:auto}
#dm-auto-mockup .home-faq div{padding:14px 5px;border-bottom:1px solid #e0e5eb;color:#263a55;font-size:12px;font-weight:800}
#dm-auto-mockup .home-faq div small{display:block;margin-top:6px;color:#8993a0;font-weight:400;font-size:11px}
#dm-auto-mockup .cta{padding:48px 7%;text-align:center;color:#fff;background:linear-gradient(120deg,#07182f,var(--navy))}
#dm-auto-mockup .cta h2{font-size:26px;margin:0 0 10px}
#dm-auto-mockup .cta p{color:rgba(255,255,255,.7);margin:0 0 20px;font-size:13px}
#dm-auto-mockup .footer{background:#071322;color:#aab5c3;padding:28px 7%;font-size:11px;line-height:1.75}
#dm-auto-mockup .footer strong{display:block;color:#fff;font-size:15px;margin-bottom:7px}
#dm-auto-mockup .request-preview{padding:12px 6%;background:#fff6e8;border-bottom:1px solid #ead8bb;color:#493a25;font-size:11px;line-height:1.5;white-space:pre-line}
#dm-auto-mockup .request-preview strong{display:block;margin-bottom:3px;color:#9a6426;font-size:12px}
@media(max-width:900px){
  #dm-auto-mockup{padding:12px}
  .dm-shell{grid-template-columns:1fr}
  .dm-panel{position:static;max-height:none}
  .dm-canvas{min-height:580px}
  #dm-auto-mockup .intro-grid{grid-template-columns:1fr}
  #dm-auto-mockup .service-grid{grid-template-columns:1fr 1fr}
  #dm-auto-mockup .process{grid-template-columns:1fr 1fr}
  #dm-auto-mockup .case-grid{grid-template-columns:1fr}
  #dm-auto-mockup .stat-row{grid-template-columns:1fr 1fr}
  .dm-device{overflow-x:auto}
  .dm-canvas{min-width:680px}
}
@media(max-width:600px){
  #dm-auto-mockup{padding:8px}
  .dm-shell{gap:10px}
  .dm-panel{padding:14px;border-radius:14px}
  .dm-panel h2{font-size:17px}
  .dm-row{grid-template-columns:1fr}
  .dm-actions{grid-template-columns:1fr 1fr}
  .dm-btn{padding:11px 8px;font-size:12px}
  .dm-stage{padding:10px;border-radius:14px}
  .dm-stage-head{flex-direction:column;align-items:flex-start;gap:5px}
  .dm-device{padding:6px;border-radius:12px}
  .dm-browser{height:26px}
  .dm-canvas{min-width:600px;min-height:480px}
}
</style>
</head>
<body style="margin:0">
<section id="dm-auto-mockup">
 <div class="dm-shell">
  <aside class="dm-panel">
   <h2>홈 시안 생성기</h2>
   <p class="dm-help">정보를 입력하고 시안 생성을 누르면 홈 화면 시안이 만들어집니다.</p>

   <details open><summary>01. 기본 정보·브랜드</summary><div class="dm-group">
    <div class="dm-field"><label>사이트 이름</label><input id="dmName" value="" placeholder="예) 홍길동컨설팅"></div>
    <div class="dm-field"><label>영문 이름</label><input id="dmEnglish" value="" placeholder="예) HG CONSULTING"></div>
    <div class="dm-field"><label>업종·핵심 서비스</label><input id="dmBusiness" value="" placeholder="예) 정책자금 · 경영컨설팅"></div>
    <div class="dm-field"><label>대메뉴 — 쉼표 구분 (네비게이션에 표시됨)</label><input id="dmMenus" value="" placeholder="예) 홈,회사소개,서비스,성공사례,상담신청"></div>
    <div class="dm-row">
     <div class="dm-field"><label>전화번호</label><input id="dmPhone" value="" placeholder="02-0000-0000"></div>
     <div class="dm-field"><label>이메일</label><input id="dmEmail" value="" placeholder="example@company.com"></div>
    </div>
    <div class="dm-field"><label>주소</label><input id="dmAddress" value="" placeholder="서울특별시 ○○구 ○○로 00"></div>
   </div></details>

   <details open><summary>02. 메인 비주얼</summary><div class="dm-group">
    <div class="dm-field"><label>메인 한 줄 문구</label><textarea id="dmFocus" style="height:52px" placeholder="예) 고객의 성공을 만드는 전문 파트너"></textarea></div>
    <div class="dm-field"><label>보조 설명</label><textarea id="dmHeroDesc" style="height:52px" placeholder="예) 전문가가 기업 상황에 맞게 밀착 지원합니다."></textarea></div>
    <div class="dm-field"><label>메인 이미지 URL</label><input id="dmHeroImage" value="" placeholder="https://..."></div>
    <div class="dm-row">
     <div class="dm-field"><label>버튼 1</label><input id="dmButton1" value="" placeholder="예) 무료 상담 신청"></div>
     <div class="dm-field"><label>버튼 2</label><input id="dmButton2" value="" placeholder="예) 서비스 보기"></div>
    </div>
   </div></details>

   <details><summary>03. 회사 소개</summary><div class="dm-group">
    <div class="dm-field"><label>소개 제목</label><input id="dmIntroTitle" value="" placeholder="예) 고객과 함께 성장하는 전문 파트너"></div>
    <div class="dm-field"><label>소개 내용</label><textarea id="dmIntro" style="height:64px" placeholder="회사 소개 내용을 입력하세요."></textarea></div>
    <div class="dm-field"><label>소개 이미지 URL</label><input id="dmIntroImage" value="" placeholder="https://..."></div>
   </div></details>

   <details><summary>04. 서비스·강점</summary><div class="dm-group">
    <p class="dm-note" style="margin-top:4px">서비스 카드 (최대 6개)</p>
    <div class="dm-field"><label>서비스 1 — 제목</label><input id="dmSv1Title" value="" placeholder="서비스명"></div>
    <div class="dm-field"><label>서비스 1 — 설명</label><textarea id="dmSv1Desc" style="height:44px" placeholder="서비스 설명을 입력하세요."></textarea></div>
    <div class="dm-field"><label>서비스 2 — 제목</label><input id="dmSv2Title" value="" placeholder="서비스명"></div>
    <div class="dm-field"><label>서비스 2 — 설명</label><textarea id="dmSv2Desc" style="height:44px" placeholder="서비스 설명을 입력하세요."></textarea></div>
    <div class="dm-field"><label>서비스 3 — 제목</label><input id="dmSv3Title" value="" placeholder="서비스명"></div>
    <div class="dm-field"><label>서비스 3 — 설명</label><textarea id="dmSv3Desc" style="height:44px" placeholder="서비스 설명을 입력하세요."></textarea></div>
    <div class="dm-field"><label>서비스 4 — 제목</label><input id="dmSv4Title" value="" placeholder="서비스명 (선택)"></div>
    <div class="dm-field"><label>서비스 4 — 설명</label><textarea id="dmSv4Desc" style="height:44px" placeholder="서비스 설명 (선택)"></textarea></div>
    <div class="dm-field"><label>서비스 5 — 제목</label><input id="dmSv5Title" value="" placeholder="서비스명 (선택)"></div>
    <div class="dm-field"><label>서비스 5 — 설명</label><textarea id="dmSv5Desc" style="height:44px" placeholder="서비스 설명 (선택)"></textarea></div>
    <div class="dm-field"><label>서비스 6 — 제목</label><input id="dmSv6Title" value="" placeholder="서비스명 (선택)"></div>
    <div class="dm-field"><label>서비스 6 — 설명</label><textarea id="dmSv6Desc" style="height:44px" placeholder="서비스 설명 (선택)"></textarea></div>
    <p class="dm-note" style="margin-top:14px">핵심 수치 (최대 4개)</p>
    <div class="dm-row">
     <div class="dm-field"><label>수치 1</label><input id="dmStat1Val" value="" placeholder="예) 300억+"></div>
     <div class="dm-field"><label>설명 1</label><input id="dmStat1Lbl" value="" placeholder="예) 누적 지원 규모"></div>
    </div>
    <div class="dm-row">
     <div class="dm-field"><label>수치 2</label><input id="dmStat2Val" value="" placeholder="예) 10년+"></div>
     <div class="dm-field"><label>설명 2</label><input id="dmStat2Lbl" value="" placeholder="예) 전문 경력"></div>
    </div>
    <div class="dm-row">
     <div class="dm-field"><label>수치 3</label><input id="dmStat3Val" value="" placeholder="예) 98%"></div>
     <div class="dm-field"><label>설명 3</label><input id="dmStat3Lbl" value="" placeholder="예) 고객 만족도"></div>
    </div>
    <div class="dm-row">
     <div class="dm-field"><label>수치 4</label><input id="dmStat4Val" value="" placeholder="예) 500+"></div>
     <div class="dm-field"><label>설명 4</label><input id="dmStat4Lbl" value="" placeholder="예) 성공 사례"></div>
    </div>
   </div></details>

   <details><summary>05. 진행 절차·사례</summary><div class="dm-group">
    <p class="dm-note" style="margin-top:4px">진행 절차 (최대 4단계)</p>
    <div class="dm-field"><label>STEP 01 — 제목</label><input id="dmSt1Title" value="" placeholder="예) 상담 접수"></div>
    <div class="dm-field"><label>STEP 01 — 설명</label><textarea id="dmSt1Desc" style="height:44px" placeholder="해당 단계 설명을 입력하세요."></textarea></div>
    <div class="dm-field"><label>STEP 02 — 제목</label><input id="dmSt2Title" value="" placeholder="예) 기업 진단"></div>
    <div class="dm-field"><label>STEP 02 — 설명</label><textarea id="dmSt2Desc" style="height:44px" placeholder="해당 단계 설명을 입력하세요."></textarea></div>
    <div class="dm-field"><label>STEP 03 — 제목</label><input id="dmSt3Title" value="" placeholder="예) 전략 수립"></div>
    <div class="dm-field"><label>STEP 03 — 설명</label><textarea id="dmSt3Desc" style="height:44px" placeholder="해당 단계 설명을 입력하세요."></textarea></div>
    <div class="dm-field"><label>STEP 04 — 제목</label><input id="dmSt4Title" value="" placeholder="예) 실행 지원"></div>
    <div class="dm-field"><label>STEP 04 — 설명</label><textarea id="dmSt4Desc" style="height:44px" placeholder="해당 단계 설명을 입력하세요."></textarea></div>
    <p class="dm-note" style="margin-top:14px">성공 사례 (최대 3개)</p>
    <div class="dm-field"><label>사례 1 — 분류</label><input id="dmCs1Cat" value="" placeholder="예) 정책자금"></div>
    <div class="dm-field"><label>사례 1 — 제목</label><input id="dmCs1Title" value="" placeholder="예) 제조기업 성장 지원"></div>
    <div class="dm-field"><label>사례 1 — 결과 설명</label><textarea id="dmCs1Desc" style="height:44px" placeholder="사례 결과를 입력하세요."></textarea></div>
    <div class="dm-field"><label>사례 2 — 분류</label><input id="dmCs2Cat" value="" placeholder="예) 기업 인증"></div>
    <div class="dm-field"><label>사례 2 — 제목</label><input id="dmCs2Title" value="" placeholder="예) 벤처기업 인증 완료"></div>
    <div class="dm-field"><label>사례 2 — 결과 설명</label><textarea id="dmCs2Desc" style="height:44px" placeholder="사례 결과를 입력하세요."></textarea></div>
    <div class="dm-field"><label>사례 3 — 분류</label><input id="dmCs3Cat" value="" placeholder="예) R&D"></div>
    <div class="dm-field"><label>사례 3 — 제목</label><input id="dmCs3Title" value="" placeholder="예) 기술개발 과제 선정"></div>
    <div class="dm-field"><label>사례 3 — 결과 설명</label><textarea id="dmCs3Desc" style="height:44px" placeholder="사례 결과를 입력하세요."></textarea></div>
   </div></details>

   <details><summary>06. FAQ·상담·푸터</summary><div class="dm-group">
    <p class="dm-note" style="margin-top:4px">자주 묻는 질문 (최대 5개)</p>
    <div class="dm-field"><label>Q1 — 질문</label><input id="dmFq1Q" value="" placeholder="예) 상담은 어떻게 진행되나요?"></div>
    <div class="dm-field"><label>Q1 — 답변</label><textarea id="dmFq1A" style="height:44px" placeholder="답변을 입력하세요."></textarea></div>
    <div class="dm-field"><label>Q2 — 질문</label><input id="dmFq2Q" value="" placeholder="예) 어떤 서류가 필요한가요?"></div>
    <div class="dm-field"><label>Q2 — 답변</label><textarea id="dmFq2A" style="height:44px" placeholder="답변을 입력하세요."></textarea></div>
    <div class="dm-field"><label>Q3 — 질문</label><input id="dmFq3Q" value="" placeholder="예) 진행 기간은 얼마나 걸리나요?"></div>
    <div class="dm-field"><label>Q3 — 답변</label><textarea id="dmFq3A" style="height:44px" placeholder="답변을 입력하세요."></textarea></div>
    <div class="dm-field"><label>Q4 — 질문 (선택)</label><input id="dmFq4Q" value="" placeholder="추가 질문 (선택)"></div>
    <div class="dm-field"><label>Q4 — 답변 (선택)</label><textarea id="dmFq4A" style="height:44px" placeholder="답변을 입력하세요."></textarea></div>
    <div class="dm-field"><label>Q5 — 질문 (선택)</label><input id="dmFq5Q" value="" placeholder="추가 질문 (선택)"></div>
    <div class="dm-field"><label>Q5 — 답변 (선택)</label><textarea id="dmFq5A" style="height:44px" placeholder="답변을 입력하세요."></textarea></div>
    <p class="dm-note" style="margin-top:14px">CTA·푸터</p>
    <div class="dm-field"><label>최종 CTA 제목</label><input id="dmCtaTitle" value="" placeholder="예) 지금 전문가와 상담하세요"></div>
    <div class="dm-field"><label>CTA 설명 문구</label><textarea id="dmCtaDesc" style="height:44px" placeholder="예) 부담 없이 문의주시면 맞춤 안내드립니다."></textarea></div>
    <div class="dm-field"><label>CTA 버튼 문구</label><input id="dmCtaBtn" value="" placeholder="예) 무료 상담 신청하기"></div>
    <div class="dm-field"><label>사업자·푸터 정보</label><textarea id="dmFooter" style="height:52px" placeholder="대표명 · 사업자등록번호 000-00-00000 · 개인정보처리방침"></textarea></div>
   </div></details>

   <details><summary>디자인·추가 요청</summary><div class="dm-group">
    <div class="dm-field"><label>추가 요청사항</label><textarea id="dmExtraRequest" style="height:60px" placeholder="원하는 기능, 구성, 디자인, 참고사항 등을 자유롭게 작성해 주세요."></textarea></div>
    <div class="dm-row">
     <div class="dm-field"><label>메인 색상</label><input id="dmColor" type="color" value="#16345c"></div>
     <div class="dm-field"><label>강조 색상</label><input id="dmAccent" type="color" value="#b47a32"></div>
    </div>
   </div></details>

   <div class="dm-actions">
    <button class="dm-btn dm-generate" id="dmGenerate">시안 생성</button>
    <button class="dm-btn dm-download" id="dmDownload">화면 저장</button>
   </div>
  </aside>

  <main class="dm-stage">
   <div class="dm-stage-head">
    <strong>생성된 홈 화면</strong>
    <span class="dm-status" id="dmStatus">입력 후 시안 생성을 눌러주세요.</span>
   </div>
   <div class="dm-device">
    <div class="dm-browser"><i class="dm-dot"></i><i class="dm-dot"></i><i class="dm-dot"></i><span class="dm-url"></span></div>
    <div class="dm-canvas" id="dmCanvas"><div style="text-align:center;padding:200px 20px;color:#8993a1">화면 예시가 이곳에 표시됩니다.</div></div>
   </div>
  </main>
 </div>
</section>
<script>
(function(){
 const $=s=>document.querySelector(s);
 const val=id=>{const el=$(id);return el?el.value.trim():''};
 const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

 function data(){
  const menus=val('#dmMenus').split(',').map(x=>x.trim()).filter(Boolean);
  const svs=[[1],[2],[3],[4],[5],[6]].map(([n])=>[val(`#dmSv${n}Title`),val(`#dmSv${n}Desc`)]).filter(x=>x[0]);
  const stats=[[1],[2],[3],[4]].map(([n])=>[val(`#dmStat${n}Val`),val(`#dmStat${n}Lbl`)]).filter(x=>x[0]);
  const steps=[[1],[2],[3],[4]].map(([n])=>({title:val(`#dmSt${n}Title`),desc:val(`#dmSt${n}Desc`)})).filter(x=>x.title);
  const cases=[[1],[2],[3]].map(([n])=>({cat:val(`#dmCs${n}Cat`),title:val(`#dmCs${n}Title`),desc:val(`#dmCs${n}Desc`)})).filter(x=>x.title);
  const faqs=[[1],[2],[3],[4],[5]].map(([n])=>({q:val(`#dmFq${n}Q`),a:val(`#dmFq${n}A`)})).filter(x=>x.q);
  return{
   name:val('#dmName')||'회사명',
   eng:val('#dmEnglish')||'COMPANY NAME',
   business:val('#dmBusiness')||'서비스 분야',
   menus:menus.length?menus:['홈','회사소개','서비스','성공사례','상담신청'],
   phone:val('#dmPhone'),email:val('#dmEmail'),address:val('#dmAddress'),
   focus:val('#dmFocus'),heroDesc:val('#dmHeroDesc'),heroImage:val('#dmHeroImage'),
   button1:val('#dmButton1'),button2:val('#dmButton2'),
   introTitle:val('#dmIntroTitle'),intro:val('#dmIntro'),introImage:val('#dmIntroImage'),
   svs,stats,steps,cases,faqs,
   cta:val('#dmCtaTitle'),ctaDesc:val('#dmCtaDesc'),ctaBtn:val('#dmCtaBtn')||val('#dmButton1'),
   footer:val('#dmFooter'),
   extra:val('#dmExtraRequest'),
   navy:$('#dmColor').value,accent:$('#dmAccent').value
  };
 }

 function buildHTML(d){
  const request=d.extra?`<section class="request-preview"><strong>추가 요청사항</strong>${esc(d.extra)}</section>`:'';
  const topbar=`<div class="topbar"><span>${esc(d.phone)}</span><span>${esc(d.email)}</span></div>`;
  const header=`<header class="site-head"><b class="site-logo">${esc(d.eng)}</b><nav class="site-nav">${d.menus.map(x=>`<span>${esc(x)}</span>`).join('')}</nav></header>`;
  const hero=`<section class="hero-photo" style="background:linear-gradient(100deg,rgba(5,18,38,.92),rgba(10,35,68,.43)),url('${esc(d.heroImage)}')"><div class="hero-in"><div class="eyebrow">${esc(d.eng)}</div><h1>${esc(d.focus)||'메인 문구를 입력하세요'}</h1><p>${esc(d.heroDesc)}</p><div class="hero-btns">${d.button1?`<span class="site-btn">${esc(d.button1)}</span>`:''}${d.button2?`<span class="site-btn ghost">${esc(d.button2)}</span>`:''}</div></div></section>`;
  const intro=(d.introTitle||d.intro)?`<section class="home-section intro-grid"><div class="intro-art" style="background:linear-gradient(rgba(7,24,47,.08),rgba(7,24,47,.08)),url('${esc(d.introImage)}')"></div><div class="intro-copy"><span class="kicker">ABOUT COMPANY</span><h2>${esc(d.introTitle)}</h2><p>${esc(d.intro)}</p><span class="site-btn">회사소개 보기</span></div></section>`:'';
  const services=d.svs.length?`<section class="home-section alt"><div class="home-title"><span class="kicker">OUR SERVICES</span><h2>${esc(d.name)}의 전문 서비스</h2><p>${esc(d.business)} 분야에 필요한 진단부터 실행까지 체계적으로 지원합니다.</p></div><div class="service-grid">${d.svs.slice(0,6).map((x,i)=>`<article class="service-item"><em>0${i+1}</em><b>${esc(x[0])}</b><p>${esc(x[1])}</p></article>`).join('')}</div></section>`:'';
  const stats=d.stats.length?`<section class="stat-row">${d.stats.slice(0,4).map(x=>`<div class="stat"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`).join('')}</section>`:'';
  const process=d.steps.length?`<section class="home-section"><div class="home-title"><span class="kicker">PROCESS</span><h2>체계적인 진행 절차</h2></div><div class="process">${d.steps.slice(0,4).map((x,i)=>`<div class="step"><small>STEP 0${i+1}</small><b>${esc(x.title)}</b><p>${esc(x.desc)}</p></div>`).join('')}</div></section>`:'';
  const cases=d.cases.length?`<section class="home-section alt"><div class="home-title"><span class="kicker">SUCCESS CASE</span><h2>주요 성공 사례</h2></div><div class="case-grid">${d.cases.slice(0,3).map(x=>`<article class="case"><div class="case-top"><small>${esc(x.cat)}</small><strong>${esc(x.title)}</strong></div><div class="case-body">${esc(x.desc)}<br><b style="color:var(--accent)">자세히 보기 →</b></div></article>`).join('')}</div></section>`:'';
  const faq=d.faqs.length?`<section class="home-section"><div class="home-title"><span class="kicker">FAQ</span><h2>자주 묻는 질문</h2></div><div class="home-faq">${d.faqs.slice(0,5).map(x=>`<div>Q. ${esc(x.q)}<span style="float:right">＋</span><small>${esc(x.a)}</small></div>`).join('')}</div></section>`:'';
  const cta=`<section class="cta"><h2>${esc(d.cta)||'지금 바로 상담하세요'}</h2><p>${esc(d.ctaDesc||d.heroDesc)}</p><span class="site-btn">${esc(d.ctaBtn||d.button1||'상담 신청')}</span></section>`;
  const footer=`<footer class="footer"><strong>${esc(d.name)}</strong>${esc(d.address)}${d.address?'<br>':''}${esc(d.phone)}${d.phone&&d.email?' · ':''}${esc(d.email)}<br>${esc(d.footer)}</footer>`;
  return request+topbar+header+hero+intro+services+stats+process+cases+faq+cta+footer;
 }

 function build(){
  const d=data();
  document.querySelector('#dm-auto-mockup').style.setProperty('--navy',d.navy);
  document.querySelector('#dm-auto-mockup').style.setProperty('--accent',d.accent);
  $('#dmCanvas').innerHTML=buildHTML(d);
  $('#dmStatus').textContent='홈 화면 시안이 생성되었습니다.';
 }

 async function download(){
  if(!$('#dmCanvas').innerHTML||$('#dmCanvas').querySelector('div[style*="padding:200px"]'))return alert('먼저 시안을 생성해주세요.');
  if(typeof html2canvas==='undefined')return alert('이미지 저장 모듈을 불러오지 못했습니다.');
  const status=$('#dmStatus'),target=$('#dmCanvas'),name=val('#dmName')||'시안';
  const filename=`${name}-홈-시안.png`;
  status.textContent='이미지를 만드는 중입니다…';
  try{
   let canvas;
   try{canvas=await html2canvas(target,{scale:1.5,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false,imageTimeout:12000})}
   catch(e){canvas=await html2canvas(target,{scale:1,useCORS:false,backgroundColor:'#ffffff',logging:false,onclone:doc=>{doc.querySelectorAll('.hero-photo,.intro-art').forEach(el=>{el.style.backgroundImage='none';el.style.backgroundColor='#16345c'})}})}
   const blob=await new Promise((res,rej)=>canvas.toBlob(v=>v?res(v):rej(new Error('PNG 변환 실패')),'image/png'));
   const url=URL.createObjectURL(blob),a=document.createElement('a');
   a.download=filename;a.href=url;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),5000);
   status.textContent='홈 화면을 PNG로 저장했습니다.';
  }catch(err){status.textContent='저장 실패 — 다시 시도해 주세요.';alert(`저장 실패: ${err.message}`)}
 }

 $('#dmGenerate').onclick=build;
 $('#dmDownload').onclick=download;
})();
</script>
</body>
</html>
